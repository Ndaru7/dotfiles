"$schema" = 'https://starship.rs/config-schema.json'

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$docker_context\
$conda\
$time\
$line_break$character"""

palette = 'tokyo_night'

[palettes.tokyo_night]
color_fg0 = '#c0caf5'
color_bg1 = '#24283b'
color_bg3 = '#414868'

color_blue = '#7aa2f7'
color_aqua = '#7dcfff'
color_green = '#9ece6a'
color_orange = '#ff9e64'
color_purple = '#bb9af7'
color_red = '#f7768e'
color_yellow = '#e0af68'

[os]
disabled = true

[os.symbols]
Windows = "󰍲"
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"
Pop = ""

[username]
show_always = true
style_user = "fg:color_blue"
style_root = "fg:color_red"
format = '[ $user ]($style)'

[directory]
style = "fg:color_aqua"
format = "in[ $path ]($style)"
truncation_length = 1
truncation_symbol = ""

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
format = 'on[[ $symbol $branch ](fg:color_purple)]($style)'

[git_status]
format = '[[($all_status$ahead_behind )](fg:color_orange)]($style)'

[nodejs]
symbol = ""
format = '[[ $symbol( $version) ](fg:color_green)]($style)'

[c]
symbol = " "
format = 'with[[ $symbol( $version) ](fg:color_blue)]($style)'

[rust]
symbol = ""
format = 'with[[ $symbol( $version) ](fg:color_orange)]($style)'

[golang]
symbol = ""
format = 'with[[ $symbol( $version) ](fg:color_aqua)]($style)'

[php]
symbol = ""
format = 'with[[ $symbol( $version) ](fg:color_purple)]($style)'

[java]
symbol = ""
format = 'with[[ $symbol( $version) ](fg:color_red)]($style)'

[kotlin]
symbol = ""
format = 'and[[ $symbol( $version) ](fg:color_orange)]($style)'

[haskell]
symbol = ""
format = 'with[[ $symbol( $version) ](fg:color_blue)]($style)'

[python]
symbol = ""
format = 'with[[ $symbol( $version) ](fg:color_yellow)]($style)'

[docker_context]
symbol = ""
format = 'with[[ $symbol( $context) ](fg:color_aqua)]($style)'

[conda]
format = 'with[[ $symbol( $environment) ](fg:color_green)]($style)'

[time]
disabled = false
time_format = "%R"
format = '[[  $time ](fg:color_blue)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:color_green)'
error_symbol = '[❯](bold fg:color_red)'
vimcmd_symbol = '[❮](bold fg:color_green)'
vimcmd_replace_one_symbol = '[❮](bold fg:color_purple)'
vimcmd_replace_symbol = '[❮](bold fg:color_purple)'
vimcmd_visual_symbol = '[❮](bold fg:color_yellow)'
